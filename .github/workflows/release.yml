name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  prepare:
    name: Check and build release artifacts
    uses: ./.github/workflows/ci.yml

  publish:
    name: Release artifacts
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          FLAGS=(--generate-notes)
          mapfile -t ARTIFACTS < <(find ./artifacts -type f)

          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            FLAGS+=(--prerelease)
          fi

          gh release create "$TAG_NAME" "${FLAGS[@]}" "${ARTIFACTS[@]}"
