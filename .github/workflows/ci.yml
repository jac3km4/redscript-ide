name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly-2026-11-13 --profile minimal --component rustfmt --no-self-update
      - run: cargo +nightly-2026-11-13 fmt --all -- --check

  check:
    name: Clippy and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +stable test --workspace --all-features --locked

  build:
    name: Build
    uses: ./.github/workflows/build.yml
