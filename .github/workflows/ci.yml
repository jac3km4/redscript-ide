name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Run clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - run: rustup toolchain install nightly-2026-10-15 --profile minimal --component rustfmt --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly-2026-10-15 fmt --package redscript-ide -- --check
      - run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +stable test --workspace --all-features --locked
      - run: cargo +stable doc --workspace --all-features --no-deps --locked

  build:
    name: Build and upload an artifact for ${{ matrix.name }}
    uses: ./.github/workflows/build.yml
    strategy:
      matrix:
        os:
          - windows-latest
          - macos-15
          - macos-15-intel
          - ubuntu-latest
        include:
          - os: windows-latest
            name: Windows
            triplet: x86_64-pc-windows-msvc
          - os: macos-15
            name: MacOS Silicon
            triplet: aarch64-apple-darwin
          - os: macos-15-intel
            name: MacOS Intel
            triplet: x86_64-apple-darwin
          - os: ubuntu-latest
            name: Linux
            triplet: x86_64-unknown-linux-gnu
    with:
      os: ${{ matrix.os }}
      triplet: ${{ matrix.triplet }}
