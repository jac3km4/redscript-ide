[workspace]
members = [".", "tools/compact-cache"]
default-members = ["."]

[workspace.dependencies]
anyhow = "1"
ignore = "0.4"
hashbrown = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ouroboros = "0.18"
fluent-uri = "0.3"
ropey = "1"
crossbeam-channel = "0.5"
mimalloc = { version = "0.1", features = ["v3"] }
miniz_oxide = "0.9"
lsp-server = "0.10"
lsp-types = "0.97"
tempfile = "3"
redscript-io = { git = "https://github.com/jac3km4/redscript", rev = "8abc8d4e494f318a6f4d1e3add53a3d463f0fe8f" }
redscript-redmod-formatter = { git = "https://github.com/jac3km4/redscript", rev = "8abc8d4e494f318a6f4d1e3add53a3d463f0fe8f" }
redscript-redmod-adapter = { git = "https://github.com/jac3km4/redscript", rev = "8abc8d4e494f318a6f4d1e3add53a3d463f0fe8f", features = ["parallel"] }
redscript-community-formatter = { git = "https://github.com/jac3km4/redscript", rev = "8abc8d4e494f318a6f4d1e3add53a3d463f0fe8f" }
redscript-compiler-api = { git = "https://github.com/jac3km4/redscript", rev = "8abc8d4e494f318a6f4d1e3add53a3d463f0fe8f", features = ["parallel"] }
redscript-compiler-frontend = { git = "https://github.com/jac3km4/redscript", rev = "8abc8d4e494f318a6f4d1e3add53a3d463f0fe8f", features = ["parallel"] }
redscript-dotfile = { git = "https://github.com/jac3km4/redscript", rev = "8abc8d4e494f318a6f4d1e3add53a3d463f0fe8f" }
redscript-code-edit = { git = "https://github.com/jac3km4/redscript", rev = "8abc8d4e494f318a6f4d1e3add53a3d463f0fe8f" }

[workspace.metadata.release]
pre-release-commit-message = "chore: release {{version}}"
publish = false

[package]
name = "redscript-ide"
version = "1.0.2"
edition = "2024"

[dependencies]
anyhow.workspace = true
ignore.workspace = true
hashbrown.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ouroboros.workspace = true
fluent-uri.workspace = true
ropey.workspace = true
crossbeam-channel.workspace = true
mimalloc.workspace = true
miniz_oxide.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
redscript-redmod-formatter.workspace = true
redscript-redmod-adapter.workspace = true
redscript-community-formatter.workspace = true
redscript-compiler-api.workspace = true
redscript-dotfile.workspace = true
redscript-code-edit.workspace = true

[dev-dependencies]
tempfile.workspace = true
redscript-compiler-frontend.workspace = true

[patch.crates-io]
stable_deref_trait = { git = "https://github.com/Storyyeller/stable_deref_trait", rev = "59a35e0a40041133c6b8744f2b62f922e7d18d5b" }

[lints.rust]
warnings = "warn"
future_incompatible = "warn"
let_underscore = "warn"
nonstandard_style = "warn"
rust_2018_compatibility = "warn"
rust_2018_idioms = "warn"
rust_2021_compatibility = "warn"
rust_2024_compatibility = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
match_same_arms = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
redundant_closure_for_method_calls = "warn"
cloned_instead_of_copied = "warn"
redundant_else = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
type_repetition_in_bounds = "warn"
equatable_if_let = "warn"
implicit_clone = "warn"
default_trait_access = "warn"
explicit_deref_methods = "warn"
explicit_iter_loop = "warn"
inefficient_to_string = "warn"
match_bool = "warn"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
