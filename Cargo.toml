[package]
name = "redscript-ide"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
ignore = "0.4"
hashbrown = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ouroboros = "0.18"
fluent-uri = "0.3"
ropey = "1"
crossbeam-channel = "0.5"
mimalloc = { version = "0.1", features = ["v3"] }
lsp-server = "0.7"
lsp-types = "0.97"

[dependencies.redscript-redmod-formatter]
git = "https://github.com/jac3km4/redscript"
rev = "v1.0.0"

[dependencies.redscript-redmod-adapter]
git = "https://github.com/jac3km4/redscript"
rev = "v1.0.0"

[dependencies.redscript-community-formatter]
git = "https://github.com/jac3km4/redscript"
rev = "v1.0.0"

[dependencies.redscript-compiler-api]
git = "https://github.com/jac3km4/redscript"
rev = "v1.0.0"

[dependencies.redscript-dotfile]
git = "https://github.com/jac3km4/redscript"
rev = "v1.0.0"

[dependencies.redscript-code-edit]
git = "https://github.com/jac3km4/redscript"
rev = "v1.0.0"

[dev-dependencies]
tempfile = "3"
redscript-compiler-frontend = { git = "https://github.com/jac3km4/redscript", rev = "v1.0.0" }

[patch.crates-io]
stable_deref_trait = { git = "https://github.com/Storyyeller/stable_deref_trait", rev = "59a35e0" }

[lints.rust]
warnings = "warn"
future_incompatible = "warn"
let_underscore = "warn"
nonstandard_style = "warn"
rust_2018_compatibility = "warn"
rust_2018_idioms = "warn"
rust_2021_compatibility = "warn"
rust_2024_compatibility = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
match_same_arms = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
redundant_closure_for_method_calls = "warn"
cloned_instead_of_copied = "warn"
redundant_else = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
type_repetition_in_bounds = "warn"
equatable_if_let = "warn"
implicit_clone = "warn"
default_trait_access = "warn"
explicit_deref_methods = "warn"
explicit_iter_loop = "warn"
inefficient_to_string = "warn"
match_bool = "warn"

[workspace.metadata.release]
pre-release-commit-message = "chore: release {{version}}"
publish = false

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
